# ============================================================
# Mosquitto MQTT Broker Configuration
# Lightweight, no-auth for internal Docker network
# ============================================================

listener 1883
protocol mqtt

# Allow anonymous connections within Docker network
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
